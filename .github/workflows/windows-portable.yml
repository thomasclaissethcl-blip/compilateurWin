name: Compiler H5P Studio Windows DOSSIER
on:
  workflow_dispatch:
  push:
    paths:
      - 'electron/**'
      - 'runtime/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/windows-portable.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit de sécurité des dépendances (informatif)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: H5P-Studio-Portable-0.5.0-Windows-DOSSIER
          path: dist/win-unpacked/
          if-no-files-found: error
